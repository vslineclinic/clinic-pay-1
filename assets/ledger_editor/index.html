<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="editor.css"><title>수납 원장 입력</title></head>
<body><div class="toolbar"><strong>수납 입력</strong><span id="summary" role="status" aria-live="polite"></span><button id="add" type="button">＋ 다음 행</button></div>
<p class="hint">입력을 1초 멈추면 자동 저장하며, Enter·다른 행 이동·원장 밖으로 이동 시 바로 저장을 요청합니다. 날짜·지점·메뉴를 이동해도 이 로그인 세션의 미저장 입력을 복구합니다. 탭 종료·새로고침 전에는 ‘저장완료’ 또는 ‘초안 저장’을 확인하세요. 여신·강언 사용 표시는 금액을 만들지 않습니다.</p>
<div class="scroll" tabindex="0" aria-label="결제수단 전체 표, 좌우로 스크롤"><table><thead id="header"></thead><tbody id="rows"></tbody></table></div>
<p id="closed" class="hint" hidden>마감된 일자입니다. 수정하려면 사유를 입력해 재개방하세요.</p>
<script src="state.js"></script><script src="editor.js"></script></body></html>
